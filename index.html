<!DOCTYPE html>
<html lang="en" data-theme="light" data-palette="default" data-contrast="normal" data-textsize="md">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>9ThirtyOne</title>
  <meta name="description" content="Cadet and cadre feedback for AFROTC detachments. Your data stays in your own Google Drive.">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light dark">

  <!-- iOS standalone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="9ThirtyOne">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/styles.css">

  <!--
    Content Security Policy. Served as a meta tag because GitHub Pages cannot
    set response headers. Everything the app talks to is Google or itself, so
    the allowlist is short and closed: no CDN, no analytics, no third party.

    frame-ancestors is deliberately absent — it is ignored in a meta tag and
    would only give false comfort. Clickjacking protection needs a real
    header, which is a reason to prefer a host that can set one.

    style-src allows 'unsafe-inline' because Google Identity Services styles its
    own sign-in button inline and pulls a stylesheet from accounts.google.com;
    without it the button renders unstyled. This is far weaker than allowing
    inline *script*, which is not permitted here — the one inline script on the
    page is pinned by hash. The app itself adds no inline styles: element styles
    go through the CSSOM, which this does not relax.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'sha256-+4WPqxDTZlDyUQYYPExPcj/zOoToK48unIR46yQvv/w=' https://accounts.google.com https://apis.google.com; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com https://script.google.com https://script.googleusercontent.com; img-src 'self' data: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self'; frame-src https://accounts.google.com;">

  <script>
    // Refuse to run inside someone else's frame.
    //
    // `frame-ancestors` is the right tool and it is ignored in a meta tag, which
    // leaves this. A static host that can set real response headers would make
    // it redundant — worth remembering when the app moves off GitHub Pages.
    //
    // Blanking the document rather than busting out of the frame: navigating the
    // top window is itself an attack when the framer is innocent, and a sandboxed
    // iframe blocks it anyway. Refusing to paint is what actually denies a
    // clickjacker the thing they need, which is a real control under their overlay.
    if (window.top !== window.self) {
      document.documentElement.innerHTML =
        '<body style="font:16px system-ui;padding:2rem;color:#14181f;background:#fff">'
        + '<h1 style="font-size:1.2rem">9ThirtyOne cannot run here</h1>'
        + '<p>This page was opened inside another site\u2019s frame, which it will not do.</p>'
        + '<p><a href="' + window.location.href + '" target="_blank" rel="noopener">Open it directly</a></p>'
        + '</body>';
      throw new Error('framed');
    }

    // Resolve the theme before first paint so the app never flashes white on a
    // dark device. Mirrors applySettings() in js/state.js.
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('nine31.settings.v1') || '{}');
        var theme = saved.theme || 'system';
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        if (saved.palette) root.dataset.palette = saved.palette;
        if (saved.contrast) root.dataset.contrast = saved.contrast;
        if (saved.textSize) root.dataset.textsize = saved.textSize;
      } catch (e) { /* first run, or storage blocked — defaults are fine */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="app">
    <header class="appbar" id="appbar">
      <!-- built by js/app.js -->
    </header>

    <main class="main" id="view" tabindex="-1">
      <noscript>
        <div class="notice notice--warn">
          <div>
            <strong class="notice__title">JavaScript is required</strong>
            9ThirtyOne runs entirely in your browser and needs JavaScript enabled.
          </div>
        </div>
      </noscript>
    </main>

    <footer class="appfoot">
      <span>9ThirtyOne — your detachment's data stays in your own Google account.</span>
      <a href="./about.html">About this app</a>
      <a href="./privacy.html">Privacy policy</a>
      <a href="./terms.html">Terms of service</a>
    </footer>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
